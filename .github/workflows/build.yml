name: Build Jellycraft

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jellycraft-mod
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Fabric Loom 1.18.2 requires a Java 25 runtime. Keep this aligned with
      # the Gradle plugin rather than the mod's Java 21 bytecode target.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Loom 1.18.2 publishes its runtime plugin variant for Gradle 9.7.
          # Pinning 8.14.4 makes Gradle reject that variant before compilation.
          gradle-version: "9.7.0"

      - name: Compile and test
        run: gradle --no-daemon build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: jellycraft-mod
          path: jellycraft-mod/build/libs/*.jar
          if-no-files-found: error
