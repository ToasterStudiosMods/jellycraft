name: Build Jellycraft

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jellycraft-mod
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Compile and test
        run: gradle --no-daemon build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: jellycraft-mod
          path: jellycraft-mod/build/libs/*.jar
          if-no-files-found: error
