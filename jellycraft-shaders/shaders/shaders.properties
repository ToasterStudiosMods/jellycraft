# ==============================================================
# JELLYCRAFT — Iris shader pack (v0.1.0)
# "Minecraft, but everything is made of jelly."
# Target: Minecraft 1.21.11 · Iris 1.10.8 · Sodium 0.8.14
# ==============================================================

# ---- Buffer formats -------------------------------------------------
colortex0Format=RGBA16F
colortex1Format=RGBA16
colortex2Format=RGBA16F
colortex3Format=RGBA16F
colortex4Format=RGBA16F

# Give solid terrain a subtle, real alpha-blended gel transmission layer.
# At the default 6% this is visible against sky/bright faces without making
# voxel ordering artifacts noticeable; water and vanilla translucent blocks
# keep their dedicated passes.
blend.gbuffers_terrain=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# ---- Shadows --------------------------------------------------------
shadowMapResolution=2048
shadowDistance=128.0
shadowDistanceRenderMul=1.0
sunPathRotation=0.0

# ---- Options --------------------------------------------------------
# Toggle options are defined as 0/1 defines in /lib/settings.glsl.
sliders=WOBBLE_STRENGTH PLAYER_BEND_STRENGTH BLOCK_TRANSLUCENCY SPARKLE_STRENGTH SUBSURFACE WETNESS REFRACTION_STRENGTH BLOOM_STRENGTH EXPOSURE SATURATION

screen=<profile> <empty> [JELLY_EFFECTS] [JELLY_MOTION] [JELLY_COLOR]
screen.JELLY_EFFECTS=BLOCK_TRANSLUCENCY REFRACTION REFRACTION_STRENGTH SSR SSR_STEPS SHADOWS CAUSTICS BLOOM BLOOM_STRENGTH
screen.JELLY_MOTION=WOBBLE WOBBLE_STRENGTH PLAYER_BEND PLAYER_BEND_STRENGTH
screen.JELLY_COLOR=EXPOSURE SATURATION SPARKLE_STRENGTH SUBSURFACE WETNESS VANILLA_MODE

# ---- Quality presets (Section 14 matrix) ----------------------------
profile.LOW=SSR:false SHADOWS:false CAUSTICS:false REFRACTION:true BLOOM:true WOBBLE:true WOBBLE_STRENGTH:50 PLAYER_BEND:true PLAYER_BEND_STRENGTH:50 BLOCK_TRANSLUCENCY:6 SPARKLE:60 SSR_STEPS:8
profile.MEDIUM=SSR:false SHADOWS:false CAUSTICS:false REFRACTION:true BLOOM:true WOBBLE:true WOBBLE_STRENGTH:100 PLAYER_BEND:true PLAYER_BEND_STRENGTH:100 BLOCK_TRANSLUCENCY:6 SPARKLE:100 SSR_STEPS:8
profile.HIGH=SSR:true SHADOWS:true CAUSTICS:true REFRACTION:true BLOOM:true WOBBLE:true WOBBLE_STRENGTH:100 PLAYER_BEND:true PLAYER_BEND_STRENGTH:100 BLOCK_TRANSLUCENCY:6 SPARKLE:120 SSR_STEPS:16
profile.ULTRA=SSR:true SHADOWS:true CAUSTICS:true REFRACTION:true BLOOM:true WOBBLE:true WOBBLE_STRENGTH:125 PLAYER_BEND:true PLAYER_BEND_STRENGTH:125 BLOCK_TRANSLUCENCY:6 SPARKLE:150 SSR_STEPS:32
