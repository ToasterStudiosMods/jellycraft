name: Build Jellycraft

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jellycraft-mod
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Fabric Loom 1.18.x needs a Java 25 runtime; the mod itself targets Java 21 bytecode.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.0"

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: jellycraft-mod
          path: |
            jellycraft-mod/build/libs/*.jar
            !jellycraft-mod/build/libs/*-sources.jar
          if-no-files-found: error
